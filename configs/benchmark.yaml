dataset:
  source: yfinance
  tickers: [AAPL, MSFT, NVDA, AMD, META, GOOGL, AMZN, SPY, QQQ, DIA, IWM, JPM, GS, BAC, XOM, CVX, SMH, TSM, VIXY, ^NSEI, RELIANCE.NS, TCS.NS, INFY.NS, CQQQ, FXI]
  start_date: '2015-01-01'
  end_date: null
  features: [Open, High, Low, Close, Volume]
  target: Close
  lookback_window: 252
  forecast_horizon: 21
  train_split: 0.8

models:
  enabled: [lstm, transformer]
  checkpoint_dir: checkpoints
  train_if_missing: true
  train_epochs: 30
  hidden_size: 64
  validation_split: 0.15
  early_stopping_patience: 30
  early_stopping_min_delta: 0.0
  save_training_history: true

backends:
  enabled: [pytorch]
  require_all_available: true
  allow_fallback: false

hardware:
  require_cuda: true
  allow_cpu_fallback: false

precisions:
  enabled: [fp32, fp16]
  allow_precision_fallback: false

batch_sizes: [1, 8, 32]

attention:
  require_flash_when_configured: false

benchmark:
  mode: paper
  warmup_iters: 20
  timed_iters: 100
  repeat_configs: 3
  clear_gpu_cache_between_runs: true
  reset_memory_stats_between_runs: true
  run_each_config_in_subprocess: true
  save_raw_results: true
  fail_fast: true
  seed: 42

tracking:
  local:
    enabled: true
    results_dir: results
  wandb:
    enabled: true
    project: finalW&BKoreaUniAnalysis
    entity: null
    mode: online
    require_login: true
    group_by: benchmark_run
    log_artifacts: true
    log_plots: true
